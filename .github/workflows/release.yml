name: Build installable release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ".[dev,bundle]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: node --test npm/test/launcher.test.cjs
      - name: Check Linux installer syntax
        if: runner.os == 'Linux'
        run: sh -n install/install.sh && sh install/install.sh --help
      - run: python -m build
      - run: python scripts/build_native.py
      - run: python scripts/package_release.py
      - name: Check Windows binary
        if: runner.os == 'Windows'
        run: ./dist/native/titan/titan.exe --version
      - name: Check Linux binary
        if: runner.os == 'Linux'
        run: ./dist/native/titan/titan --version
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ runner.os }}
          path: dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: dist/native/titan/
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble npm package and verified release files
        run: |
          mkdir -p dist/release
          cp downloaded/assets-Windows/* dist/release/
          cp downloaded/assets-Linux/Titan-*-linux-*.zip dist/release/
          cp downloaded/assets-Windows/*.whl dist/
          chmod +x downloaded/native-Linux/titan
          python scripts/build_npm.py --native win32-x64=downloaded/native-Windows --native linux-x64=downloaded/native-Linux --out dist/release
          cd dist/release
          sha256sum Titan-*.zip *.whl *.tar.gz *.tgz install.sh install.ps1 bootstrap.py > SHA256SUMS.txt
      - name: Smoke-test installed npm command on Linux
        run: |
          sh dist/release/install.sh --help
          npm install -g ./dist/release/titan-diagnostics-*.tgz --ignore-scripts
          titan --version
          titan --help
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo 'Tag and package versions disagree.' >&2
            exit 1
          fi
          gh release create "v$version" dist/release/* --target "$GITHUB_SHA" --title "Titan $version" --notes-file RELEASE_SUMMARY.md
