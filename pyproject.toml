[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "titan-diagnostics"
version = "0.2.0"
description = "Offline system monitoring and evidence-based diagnostics in your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Titan contributors"}]
dependencies = ["textual>=8.2.8,<9", "rich>=14.3.4,<15", "typer>=0.27.3,<1", "psutil>=7.2.2,<8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "Environment :: Console"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=2.4,<3", "types-psutil>=7,<8", "build>=1,<2", "hatchling>=1.27,<2"]
bundle = ["pyinstaller>=6.15,<7"]

[project.scripts]
titan = "titan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "install", "npm", "docs", "examples", "third_party_licenses", ".github", ".gitignore", "*.md", "LICENSE", "pyproject.toml", "requirements-lock.txt"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/titan"]

[tool.coverage.run]
source = ["titan"]

[tool.coverage.report]
show_missing = true

